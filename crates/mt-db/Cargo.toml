[package]
name = "mt-db"
description = "SQLite schemas, migrations and typed queries for the desktop library and device databases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
device-seeding = []

[dependencies]
blake3 = "=1.8.7"
icu_collator = "=2.4.0"
mt-meta.workspace = true
mt-types.workspace = true
rusqlite = { workspace = true, features = ["bundled", "collation", "functions", "cache", "uuid"] }
rustc-hash = "=2.1.3"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
thiserror.workspace = true
tempfile = "=3.27.0"
uuid = { version = "=1.29.3", features = ["v7"] }

[dev-dependencies]
gen-fixtures = { path = "../../tools/gen-fixtures" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "=0.25.5"

[lints]
workspace = true

[[bench]]
name = "library_queries"
harness = false

[[bench]]
name = "folder_scan"
harness = false
