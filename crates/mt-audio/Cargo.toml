[package]
name = "mt-audio"
description = "Audio engine: decoding, gapless queue, EQ, ReplayGain and output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
assert_no_alloc = "=1.1.2"
audioadapter-buffers = "=5.2.0"
cpal = "=0.18.2"
mp4parse = "=0.17.0"
mt-types.workspace = true
opus = "=0.4.0"
rand = "=0.10.4"
ringbuf = "=0.6.0"
rubato = "=5.1.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "aiff", "alac", "all-meta", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = ["AudioServices", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFURL", "std"] }
tempfile = "=3.27.0"

[dev-dependencies]
gen-fixtures = { path = "../../tools/gen-fixtures" }
lofty = "=0.25.5"
tempfile = "=3.27.0"

[lints]
workspace = true
