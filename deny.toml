# cargo-deny configuration — see plan.md E0.S5 and CONTRIBUTING.md
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices for compile-time proc-macro crates we don't depend on directly.
# Vulnerability advisories are never ignored. Revisit when upstream drops them.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste (unmaintained): proc-macro used by specta" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (unmaintained): via gtk-rs glib-macros, used by Tauri on Linux" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "CC-BY-4.0",
  "Python-2.0",
  "OFL-1.1",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

# Debug audio callback allocation guard.
[[licenses.exceptions]]
name = "assert_no_alloc"
version = "=1.1.2"
allow = ["BSD-1-Clause"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Keep a single TLS stack: rustls only.
deny = [
  { name = "openssl", reason = "use rustls" },
  { name = "openssl-sys", reason = "use rustls" },
  { name = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
