name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used here, so fork PRs are safe. Release signing lives in release.yml (tags only).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries (Tauri, audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev ffmpeg
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      # tauri::generate_context! embeds the built frontend, so it must exist before compiling.
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Desktop library query budgets (50k tracks)
        if: runner.os == 'Linux'
        run: |
          cargo bench --locked -p mt-db --bench library_queries
          cargo bench --locked -p mt-app --bench desktop_search
      - name: Generated files are up to date
        shell: bash
        run: |
          cargo run -q -p gen-tokens -- --check
          git diff --exit-code -- apps/desktop/src/bindings.ts
      - name: Generate audio fixtures
        if: runner.os == 'Linux'
        run: cargo run --locked -q -p gen-fixtures
      - name: Check metadata across audio fixtures
        if: runner.os == 'Linux'
        run: cargo test --locked -p mt-meta --test formats -- --ignored
      - name: Check decode, gapless transitions, and ReplayGain tags
        if: runner.os == 'Linux'
        run: cargo test --locked -p mt-audio --test decode --test gapless --test dsp -- --ignored
      - name: Play audio fixtures through CPAL on the ALSA null device
        if: runner.os == 'Linux'
        run: |
          alsa_config="$RUNNER_TEMP/mytunes-alsa.conf"
          cat > "$alsa_config" <<'EOF'
          pcm.!default {
              type null
              hint {
                  show on
                  description "MyTunes CI playback"
              }
          }
          EOF
          ALSA_CONFIG_PATH="$alsa_config" cargo test --locked -p mt-audio --test device -- --ignored --test-threads=1

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build (debug)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm tauri build --debug --bundles appimage
          else
            pnpm tauri build --debug --no-bundle
          fi
      - name: End-to-end smoke test (real webview via tauri-driver)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
          xvfb-run -a pnpm e2e
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mytunes-linux-appimage
          path: target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error

  licenses:
    name: Licences & advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: npm licences
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm licenses list --json | node ../../tools/check-npm-licenses.mjs

  flutter:
    name: Flutter (analyze, test, Android debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      # cargokit always builds with the `stable` toolchain (it ignores rust-toolchain.toml).
      - name: Install Rust stable and Android targets
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: mytunes-pod-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the Flutter–Rust bridge integration tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: cd apps/mobile && flutter test --no-pub integration_test -d emulator-5554

  ios:
    name: iOS build (no codesign)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      - name: Install Rust stable and iOS targets
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Check the shared audio engine for iOS
        working-directory: .
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
          cargo check --locked -p mt-audio --target aarch64-apple-ios
      - name: Start an iPhone Simulator during the device build
        run: |
          set -o pipefail
          simulator=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains(".iOS-"))
            | .value[] | select(.name | startswith("iPhone"))]
            | sort_by(.state == "Booted") | last | [.udid, .state] | @tsv')
          read -r simulator_id simulator_state <<< "$simulator"
          if [ -z "$simulator_id" ]; then
            echo 'No available iPhone simulator on this runner.'
            exit 1
          fi
          if [ "$simulator_state" != 'Booted' ]; then
            xcrun simctl boot "$simulator_id"
          fi
          echo "MYTUNES_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
      - name: Archive the unsigned iPhone build for local signing
        run: tar -czf "$RUNNER_TEMP/mytunes-pod-ios-unsigned.tar.gz" -C build/ios/iphoneos Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: mytunes-pod-ios-unsigned
          path: ${{ runner.temp }}/mytunes-pod-ios-unsigned.tar.gz
          if-no-files-found: error
      - name: Run the Flutter–Rust bridge integration tests on iPhone Simulator
        timeout-minutes: 20
        run: |
          xcrun simctl bootstatus "$MYTUNES_IOS_SIMULATOR_ID" -b
          flutter test --no-pub integration_test -d "$MYTUNES_IOS_SIMULATOR_ID"
